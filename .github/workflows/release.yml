name: Release

# Pushing a v* tag: packages all four platforms and creates a draft Release (the user checks it and publishes by hand).
# workflow_dispatch: packages only and uploads workflow artifacts without creating a Release, for a trial build before releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Package on an older Ubuntu so the app is less likely to fail on older distributions because of too new a glibc
          - os: ubuntu-22.04
            name: linux
            args: --linux
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: mac-arm64
            args: --mac
          # Scheduled to be retired in August 2027; see docs/releasing.md
          - os: macos-15-intel
            name: mac-x64
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci
      - run: npx vitest run
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Don't try to sign with a keychain certificate; mac.identity '-' gives an ad-hoc signature instead
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Show macOS code signature
        if: runner.os == 'macOS'
        run: codesign -dv --verbose=2 dist/mac*/Knowmon.app

      - uses: actions/upload-artifact@v7
        with:
          name: knowmon-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*-setup.exe
            dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -l artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes artifacts/*
