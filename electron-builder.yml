appId: com.knowmon.app
productName: Knowmon
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{docs,test-vault,scripts}/**'
  - '!{CLAUDE.md,vitest.config.ts}'
asarUnpack:
  - resources/**
  # SQLite 以 dlopen 載入擴充，不能放在 asar 裡（路徑轉換見 src/main/db/index.ts 的 unpackedPath）
  - node_modules/sqlite-vec-*/**
win:
  executableName: knowmon
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # 只產 dmg，不另外產 zip
  target: dmg
  # 沒有 Apple Developer 憑證：用 ad-hoc 簽章（Apple Silicon 沒有有效簽章的 App 不能執行）。
  # hardened runtime 只有公證時需要；ad-hoc 簽章加上 library validation 會擋掉 sqlite-vec 的 dylib，所以關掉
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Knowmon reads and writes notes in vaults stored in your Documents folder.
    - NSDownloadsFolderUsageDescription: Knowmon reads and writes notes in vaults stored in your Downloads folder.
  notarize: false
dmg:
  # 檔名帶 arch，arm64 與 x64 兩個 dmg 才不會在 Release 裡同名覆蓋
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
    # deb 與 rpm 共用 electron-builder 預設的 after-install 腳本，會設定 chrome-sandbox 的 SUID
    - rpm
  maintainer: Richard Lai <richardlaiis@proton.me>
  category: Office
  syncDesktopName: true
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# AppImage 改用 static runtime（beta）：舊的 runtime 需要 libfuse2，Ubuntu 22.04 之後預設沒有安裝
toolsets:
  appimage: '1.0.3'
# 沒有自動更新；不寫的話 electron-builder 會依 git remote 自動產生 GitHub 的更新設定
publish: null
