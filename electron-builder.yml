appId: com.knowmon.app
productName: Knowmon
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{docs,test-vault,scripts}/**'
  - '!{CLAUDE.md,vitest.config.ts}'
asarUnpack:
  - resources/**
  # SQLite loads extensions with dlopen, so they can't be inside the asar (for the path conversion see unpackedPath in src/main/db/index.ts)
  - node_modules/sqlite-vec-*/**
win:
  executableName: knowmon
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # dmg only, no separate zip
  target: dmg
  # No Apple Developer certificate: use an ad-hoc signature (Apple Silicon won't run apps without a valid signature).
  # The hardened runtime is only needed for notarization; ad-hoc signing with library validation blocks sqlite-vec's dylib, so it's off
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Knowmon reads and writes notes in vaults stored in your Documents folder.
    - NSDownloadsFolderUsageDescription: Knowmon reads and writes notes in vaults stored in your Downloads folder.
  notarize: false
dmg:
  # Include the arch in the file name, so the arm64 and x64 dmgs don't overwrite each other in the Release
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
    # deb and rpm share electron-builder's default after-install script, which sets chrome-sandbox's SUID bit
    - rpm
  maintainer: Richard Lai <richardlaiis@proton.me>
  category: Office
  syncDesktopName: true
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# The AppImage uses the static runtime (beta): the old runtime needs libfuse2, which Ubuntu no longer installs by default after 22.04
toolsets:
  appimage: '1.0.3'
# No auto-updates; without this, electron-builder generates GitHub update settings from the git remote
publish: null
